# One Piece OP17 card prices - Airflow + PostgreSQL + Streamlit
# Usage:  copy .env.example .env   (then edit passwords)
#         docker compose up -d
# Airflow UI : http://localhost:8080      Dashboard : http://localhost:8501

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Bangkok
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Bangkok
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set in .env}
    _PIP_ADDITIONAL_REQUIREMENTS: "beautifulsoup4==4.12.3"
    DATA_DB_HOST: postgres
    DATA_DB_PORT: 5432
    DATA_DB_NAME: cards
    DATA_DB_USER: ${POSTGRES_USER}
    DATA_DB_PASSWORD: ${POSTGRES_PASSWORD}
    PIPELINE_DATA_DIR: /opt/airflow/data
    QUALITY_MIN_ROWS: ${QUALITY_MIN_ROWS:-100}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cards
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"          # host 5433 so it does not clash with a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d cards"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/data && chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/data
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in .env}
      _PIP_ADDITIONAL_REQUIREMENTS: ""

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    environment:
      <<: *airflow-env
      _PIP_ADDITIONAL_REQUIREMENTS: ""                    # webserver does not run tasks
      AIRFLOW__WEBSERVER__WORKERS: 2                      # default 4 is too heavy on a laptop
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: 600  # default 120s -> gunicorn killed on slow start
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 300
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  web:
    build: ./web
    environment:
      DATA_DB_HOST: postgres
      DATA_DB_PORT: 5432
      DATA_DB_NAME: cards
      DATA_DB_USER: ${POSTGRES_USER}
      DATA_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
